<!--
	Multi-select bulk-action bar — the ACTION host only. The selection *context*
	(UTub breadcrumb + count + "N hidden by filter" + Exit ✕) and the single
	#URLBulkSelectionAnnouncement live region now live in the URL-deck header /
	subheader (URLDeckHeader.html / URLDeckSubheader.html); this bar keeps just
	the action registry region and Select All / Clear.

	Starts `.hidden`; bulk-actions/bulk-bar.ts reveals it on mode-enter and paints
	the count / hidden-hint / SR announcement (all in the header now) on every
	selection change via the preserved global ids.

	Static words ("Select All", "Clear") are Jinja literals.

	#bulkActionButtons is the capability-aware action-registry region — empty in
	Phase 1; bulk-tag (Phase 2) and bulk-copy (Phase 3) render buttons into it.
-->
<div id="bulkActionBar" class="bulkBar hidden" role="region" aria-label="Bulk actions">
	<div class="bulkBarGrabber" aria-hidden="true"></div>
	<div class="bulkBarRow flex-row align-center">
		<div id="bulkActionButtons" class="bulkActions"></div>
		<span class="bulkSpacer"></span>
		<button id="bulkSelectAll" class="barBtn" type="button">Select All</button>
		<button id="bulkSelectClear" class="barBtn clear" type="button" aria-disabled="true">Clear</button>
	</div>
</div>

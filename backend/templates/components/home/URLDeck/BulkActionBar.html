<!--
	Multi-select bulk-action bar — the ACTION host only. The selection *context*
	(UTub breadcrumb + count + "N hidden by filter" + Exit ✕) and the single
	#URLBulkSelectionAnnouncement live region now live in the URL-deck header /
	subheader (URLDeckHeader.html / URLDeckSubheader.html); this bar keeps just
	the action registry region and Select All / Clear.

	Starts `.hidden`; bulk-actions/bulk-bar.ts reveals it on mode-enter and paints
	the count / hidden-hint / SR announcement (all in the header now) on every
	selection change via the preserved global ids.

	Static words ("Select All", "Clear") are Jinja literals.

	#bulkActionButtons is the capability-aware action-registry region — empty in
	Phase 1; bulk-tag (Phase 2) and bulk-copy (Phase 3) render buttons into it.
-->
<div id="bulkActionBar" class="bulkBar hidden" role="region" aria-label="Bulk actions">
	{# No drag-handle "grabber" lip here: the mobile bulk-action bar is a FIXED
	   docked drawer, not a draggable/swipeable sheet, so a grabber falsely implied
	   it could be dragged. #}
	<div class="bulkBarRow flex-row align-center">
		<div id="bulkActionButtons" class="bulkActions"></div>
		<span class="bulkSpacer"></span>
		<button id="bulkSelectAll" class="barBtn" type="button">Select All</button>
		<button id="bulkSelectClear" class="barBtn clear" type="button" aria-disabled="true">Clear</button>
	</div>
	<!--
		Bulk-tag picker mount + result banner. Both live OUTSIDE #bulkActionButtons
		(which bulk-bar.ts empties/rebuilds on every selection/filter change) so the
		open picker and the outcome banner are never destroyed by that rebuild.
		bulk-tag.ts (Phase 2) mounts the BULK-mode combobox into #bulkTagPickerMount
		and renders success/partial/fail into #bulkTagResultBanner (role=status).
	-->
	<div id="bulkTagPickerMount" class="bulkTagPickerMount hidden"></div>
	<div id="bulkTagResultBanner" class="bulkTagBanner hidden" role="status"></div>
	<!--
		Bulk-copy destination-UTub picker mount + result banner (Phase 3). Same
		outside-#bulkActionButtons placement as the tag pair above so the open
		picker + outcome banner survive the action-button rebuild. bulk-copy.ts
		mounts a roving-tabindex listbox into #bulkCopyPickerMount and renders
		success/partial/fail into #bulkCopyResultBanner (role=status).
	-->
	<div id="bulkCopyPickerMount" class="bulkCopyPickerMount hidden"></div>
	<div id="bulkCopyResultBanner" class="bulkTagBanner hidden" role="status"></div>
</div>

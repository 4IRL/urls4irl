<div class="modal-header">
    <h4 class="modal-title" id="RegisterConfirmationModalLabel">Register</h4>
    <button type="button" class="btn-close close-register-login-modal" data-bs-dismiss="modal" aria-label="close">
    </button>
</div>
<div class="modal-body">
    <div id="SplashModalAlertBanner" class="alert alert-banner-splash-modal-hide" role="alert"></div>
    <p class="text-muted">
        For your security, you'll see this same message whether the email is brand-new,
        already registered, or not yet confirmed. A username that's already taken still
        shows a field error on the register form.
    </p>
    <div class="d-flex justify-content-center">
        <small class="text-muted">
            <a href="#" id="ResendRegistrationEmail" class="splash-page-links">Didn't get the email? Resend</a>
        </small>
    </div>
</div>
<div class="modal-footer register-login-modal-footer">
    <button id="BackToLoginFromConfirmation" type="button"
        class="btn btn-success login-register-form-group col-12 login-register-buttons">Back to login</button>
</div>

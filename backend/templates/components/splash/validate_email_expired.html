{# Static shown shell for an expired confirmation link; splash.ts shows it via Bootstrap and binds it. #}
{% set confirm_email_back_label = "Close" %}
<div class="modal fade show" id="ConfirmEmailModal" tabindex="-1" aria-labelledby="ConfirmEmailModalLabel" style="display: block;"
    aria-modal="true" role="dialog" data-resend-token="{{ expired_resend_token }}">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            {% include 'components/splash/confirm_email.html' %}
        </div>
    </div>
</div>

# Append this nginx hop's scheme to Cloudflare's X-Forwarded-Proto so the header
# carries two values (CF + nginx), matching ProxyFix(x_proto=2) in
# backend/__init__.py. Mirrors how $proxy_add_x_forwarded_for already gives
# X-Forwarded-For two values; without it x_proto=2 is starved and url_for(
# _external=True) falls back to http (breaks Google OAuth redirect_uri match).
# NOTE: `map` must live at http{} level and appear once per nginx instance. If
# this host serves multiple server confs, move it to a shared http-level include.
map $http_x_forwarded_proto $u4i_forwarded_proto {
  default "$http_x_forwarded_proto, $scheme";
  ""      $scheme;
}

server {
  listen 8000 ssl;
  server_name urls.4irl.app www.urls.4irl.app;

  # location of SSL certificate
  ssl_certificate /etc/letsencrypt/live/urls.4irl.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/urls.4irl.app/privkey.pem;

  access_log /var/log/u4i_access.log;
  error_log /var/log/u4i_error.log;

  location / {
          proxy_pass http://localhost:8659;
          proxy_redirect off;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $u4i_forwarded_proto;
          error_page 501 502 503 =200 @fallback;
  }

  location /static/dist/ {
          alias /home/u4i/static/dist/;
          expires 1y;
          add_header Cache-Control "public, immutable";
  }

  location /static {
          alias /home/u4i/static;
          expires 30d;
  }

  location /assets {
          alias /home/u4i/static;
          expires 30d;
  }

  location /health {
	  allow 127.0.0.1;
	  deny all;

	  proxy_pass http://localhost:8659;

	  error_page 404 403 = @fallback;
  }

  location @fallback {
        root /var/www/html;
        rewrite ^(.*)$ /homepage.html break;
  }
}

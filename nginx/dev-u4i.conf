# Append this nginx hop's scheme to Cloudflare's X-Forwarded-Proto so the header
# carries two values (CF + nginx), matching ProxyFix(x_proto=2) in
# backend/__init__.py. Mirrors how $proxy_add_x_forwarded_for already gives
# X-Forwarded-For two values; without it x_proto=2 is starved and url_for(
# _external=True) falls back to http (breaks Google OAuth redirect_uri match).
# NOTE: `map` must live at http{} level and appear once per nginx instance. If
# this host serves multiple server confs, move it to a shared http-level include.
map $http_x_forwarded_proto $u4i_forwarded_proto {
        default "$http_x_forwarded_proto, $scheme";
        ""      $scheme;
}

server {
        listen 80;
        server_name devurls1.4irl.app;

        access_log /var/log/dev-urls4irl-access.log;
        error_log /var/log/dev-urls4irl-error.log;

        location /static/dist/ {
            alias /home/site-ops/static/dist/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /static {
            alias /home/site-ops/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /assets {
            alias /home/site-ops/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://localhost:8659;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $u4i_forwarded_proto;
        }
}

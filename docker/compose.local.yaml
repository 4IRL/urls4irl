name: u4i-local

services:
  web:
    container_name: u4i-local-web
    # PID 1 would otherwise be `flask run`, which never reaps orphans, so SIGKILLed pytest-xdist
    # workers would linger as <defunct> zombies until web restarts; docker-init reaps them.
    init: true
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: docker/Dockerfile.Local
      args:
        HOST_UID: "${HOST_UID:-1001}"
        HOST_GID: "${HOST_GID:-1001}"
    ports:
      - "8659:5000"
    user: u4i-host:u4i-host-group
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-metrics:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PRODUCTION=false
      # Per-worktree dev DB (beats .env's POSTGRES_DB, now only the cluster's bootstrap name) and the
      # test role; both expressions are shared with db-init so each name has one source of truth.
      - POSTGRES_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
      - POSTGRES_TEST_USER=${U4I_TEST_ROLE:-u4i_test}
      - REDIS_URI=redis://redis:6379/0
      - TEST_REDIS_URI=redis://redis:6379/1
      - TEST_METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - FLASK_DEBUG=true
      - FLASK_ENV=development
      - BASE_EMAIL=u4i@urls4irl.app
      - DOCKER=true
      - PLAYWRIGHT_WS_URL=ws://playwright:3000/
      - VITE_DEV_SERVER=true
      - VITE_URL=http://localhost:5173
      - VITE_INTERNAL_HOST=vite
      - ENABLE_SSL=false
      # Anonymous metrics knobs. METRICS_ENABLED is on by default locally (see the
      # `make metrics-*` targets). Opt a machine out with METRICS_ENABLED=false in
      # `.env`, which make reads via `--env-file .env`; never rely on a shell export.
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_FLUSH_INTERVAL_SECONDS=60
      - METRICS_BUCKET_SECONDS=3600
      - METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - METRICS_BATCH_NONCE_TTL_SECONDS=120
    volumes:
      - ./run.py:/code/u4i/run.py
      - ./pytest.ini:/code/u4i/pytest.ini
      - ./backend:/code/u4i/backend
      - ./tests:/code/u4i/tests
      - ./migrations:/code/u4i/migrations
      - ./migrations/versions:/code/u4i/migrations/versions
      - ./scripts:/code/u4i/scripts
      - ./docker:/code/u4i/docker:ro
      - ./frontend/types:/code/u4i/frontend/types
      - app_logs:/app/volume

  vite:
    container_name: u4i-local-vite
    build:
      context: .
      dockerfile: docker/Dockerfile.Vite
    ports:
      - "5173:5173"
    networks:
      default:
        aliases:
          - localhost
    environment:
      - NODE_ENV=development
      - ENABLE_SSL=false
      - DOCKER=true
    volumes:
      - ./frontend:/app/frontend
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./frontend/pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - /app/node_modules
      # Masks host frontend/node_modules (pnpm symlinks into the host store, unresolvable here)
      - /app/frontend/node_modules
      - ./backend/static/dist:/app/backend/static/dist
    command: pnpm run dev
    healthcheck:
      test: |
        if [ "$${ENABLE_SSL:-false}" = "true" ]; then
          curl -f -k https://localhost:5173/@vite/client
        else
          curl -f http://localhost:5173/@vite/client
        fi
      interval: 10s
      timeout: 5s
      retries: 3

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: u4i-playwright
    init: true
    user: pwuser
    working_dir: /home/pwuser
    # The official image ships the browsers + node but NOT the playwright CLI on
    # PATH; the documented browser-server invocation is npx with a version pinned
    # to the image tag (and to the pip pin in requirements-test.txt).
    command: npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0
    depends_on:
      web:
        condition: service_healthy
      vite:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - /dev/shm:/dev/shm

  workflow:
    container_name: u4i-local-workflow
    build:
      context: .
      dockerfile: docker/Dockerfile.Workflow
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-metrics:
        condition: service_healthy
    environment:
      - PRODUCTION=false
      - DEV_SERVER=false
      - METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - METRICS_BUCKET_SECONDS=3600
      - METRICS_FLUSH_LIVENESS_THRESHOLD_SECONDS=180
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Local backup/cron scripts target the per-worktree dev DB (same expression as web).
      - POSTGRES_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
    volumes:
      - app_logs:/app/volume
      - pgdata:/var/lib/postgresql/data:ro
      - workflow_logs:/app/workflow_logs
      - backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/metrics-venv/bin/python", "/app/check_flush_liveness.py"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 200s

  # One cluster for the dev DB and every per-run test DB. Sized by `make capacity`; durability is
  # traded for test speed (fsync=off), so a host crash can corrupt pgdata — recover with
  # `docker volume rm` then `make up d=1 && make reset-db`.
  db:
    image: postgres:16.3-bookworm
    container_name: u4i-local-postgres
    command: postgres -c max_connections=${U4I_PG_MAX_CONN:-263} -c shared_buffers=${U4I_PG_SHARED_BUFFERS_MB:-128}MB -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    env_file:
      - .env
    environment:
      # Bootstrap name only (fresh volume); db-init renames it to U4I_DEV_DB.
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
        # `postgres`, not $POSTGRES_DB: after db-init's rename the bootstrap DB no longer exists.
        test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

  # One-shot, idempotent provisioning on every `up` (docker/db-provision.sh): test role, one-time
  # legacy dev-DB rename, dev-DB isolation, base test DB. The `u4i_dev_urls4irl` default matches the
  # Makefile's derived U4I_DEV_DB on the primary clone, so a raw `docker compose` stays consistent.
  db-init:
    image: postgres:16.3-bookworm
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/db-provision.sh:/db-provision.sh:ro
    entrypoint: ["bash", "/db-provision.sh"]
    environment:
      - PGHOST=db
      - U4I_DEV_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
      - LEGACY_DEV_DB=${POSTGRES_DB}
      - U4I_TEST_ROLE=${U4I_TEST_ROLE:-u4i_test}
      - U4I_PG_TEST_CONN_LIMIT=${U4I_PG_TEST_CONN_LIMIT:-230}

  redis:
    image: redis:6.2
    container_name: u4i-local-redis
    command: redis-server --databases 32
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-metrics:
    image: redis:6.2
    container_name: u4i-local-redis-metrics
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no --databases ${REDIS_METRICS_DATABASES:-16}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # On-demand public tunnel for remote testing (e.g. checking the mobile layout
  # from a phone). Dormant unless explicitly started via the "tunnel" profile
  # (`make tunnel`). Cloudflare quick tunnels need no account or token and print
  # an ephemeral https://<random>.trycloudflare.com URL to their logs.
  #
  # SECURITY: that trycloudflare.com URL grants UNAUTHENTICATED public access to
  # the entire local app (no login wall in front of the tunnel). Treat it as a
  # temporary, private link — never share it publicly and never leave the tunnel
  # running; tear it down (`make tunnel` stop / stop this service) when finished.
  #
  # `--url http://web:5000` points at Flask's INTERNAL container port (the `web`
  # service listens on 5000 inside the compose network), not a host-published port.
  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: u4i-local-cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:5000
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  app_logs:
  workflow_logs:
  backups:



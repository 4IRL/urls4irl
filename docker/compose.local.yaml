# One spoke: this checkout's stack. Run it only through make, which computes the per-checkout names
# (U4I_PROJECT, U4I_WEB_HOST, U4I_VITE_HOST, U4I_SHARED_NET), resolves the host ports, and starts the
# per-user hub (docker/compose.hub.yaml: db, playwright) first. `make stack-info` prints them all.
name: ${U4I_PROJECT:?run the stack through make (it computes U4I_PROJECT)}

services:
  web:
    # PID 1 would otherwise be `flask run`, which never reaps orphans, so SIGKILLed pytest-xdist
    # workers would linger as <defunct> zombies until web restarts; docker-init reaps them.
    init: true
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: docker/Dockerfile.Local
      args:
        HOST_UID: "${HOST_UID:-1001}"
        HOST_GID: "${HOST_GID:-1001}"
    ports:
      - "${U4I_WEB_PORT:-8659}:5000"
    user: u4i-host:u4i-host-group
    # The hub db is another project: `make up` starts it (hub-up) before this stack, never depends_on.
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-metrics:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PRODUCTION=false
      # Per-worktree dev DB (overrides .env's POSTGRES_DB; the hub db bootstraps only `postgres`),
      # shared with db-init, and the test role, whose expression is shared with the hub's cluster-init.
      - POSTGRES_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
      - POSTGRES_TEST_USER=${U4I_TEST_ROLE:-u4i_test}
      - REDIS_URI=redis://redis:6379/0
      - TEST_REDIS_URI=redis://redis:6379/1
      - TEST_METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - FLASK_DEBUG=true
      - FLASK_ENV=development
      - BASE_EMAIL=u4i@urls4irl.app
      - DOCKER=true
      # The hub's shared browser server, by its hub service name on u4i_shared.
      - PLAYWRIGHT_WS_URL=ws://playwright:3000/
      # This spoke's slugged alias, which the hub browser uses as UI tests' base URL (DOCKER_BASE_URL).
      - U4I_WEB_HOST=${U4I_WEB_HOST:?run the stack through make (it computes U4I_WEB_HOST)}
      # Browsers scope cookies by host, not port: spokes sharing 127.0.0.1 need distinct session cookies.
      - U4I_SESSION_COOKIE_NAME=${U4I_PROJECT:?run the stack through make (it computes U4I_PROJECT)}_session
      - VITE_DEV_SERVER=true
      - VITE_URL=http://localhost:${U4I_VITE_PORT:-5173}
      - VITE_INTERNAL_HOST=${U4I_VITE_HOST:?run the stack through make (it computes U4I_VITE_HOST)}
      - ENABLE_SSL=false
      # Anonymous metrics knobs. METRICS_ENABLED is on by default locally (see the
      # `make metrics-*` targets). Opt a machine out with METRICS_ENABLED=false in
      # `.env`, which make reads via `--env-file .env`; never rely on a shell export.
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_FLUSH_INTERVAL_SECONDS=60
      - METRICS_BUCKET_SECONDS=3600
      - METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - METRICS_BATCH_NONCE_TTL_SECONDS=120
      # UI failure-artifact knobs (tests/functional/failure_artifacts.py): tracing mode
      # (off | retain-on-failure; opt-in, since tracing costs ~+30% UI-suite wall-clock)
      # and how many run dirs to keep per checkout.
      - U4I_UI_TRACE=${U4I_UI_TRACE:-off}
      - U4I_TEST_ARTIFACTS_KEEP=${U4I_TEST_ARTIFACTS_KEEP:-10}
    volumes:
      - ./run.py:/code/u4i/run.py
      - ./pytest.ini:/code/u4i/pytest.ini
      - ./backend:/code/u4i/backend
      - ./tests:/code/u4i/tests
      - ./migrations:/code/u4i/migrations
      - ./migrations/versions:/code/u4i/migrations/versions
      - ./scripts:/code/u4i/scripts
      - ./docker:/code/u4i/docker:ro
      # Live pins, not the image's build-time copy (test_compose_hub.py checks the Playwright version triad).
      - ./requirements:/code/u4i/requirements:ro
      - ./frontend/types:/code/u4i/frontend/types
      # Generated endpoint registry (`make generate-endpoints`). A directory mount, so git's
      # inode-swapping checkouts of the files inside stay visible to web.
      - ./docs/endpoints:/code/u4i/docs/endpoints
      # UI failure artifacts (tests/functional/failure_artifacts.py); make pre-creates the source host-owned, since
      # Docker would create a missing one as root.
      - ./tmp/test-artifacts:/code/u4i/tmp/test-artifacts
      - app_logs:/app/volume
    networks:
      default: {}
      # Compose also registers the bare name `web` here, which resolves to every spoke's web with N
      # spokes up: never use it in-network, only U4I_WEB_HOST (web-<slug>).
      u4i_shared:
        aliases:
          - ${U4I_WEB_HOST:?run the stack through make (it computes U4I_WEB_HOST)}

  vite:
    profiles: ["ui", "full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.Vite
      args:
        HOST_UID: "${HOST_UID:-1001}"
        HOST_GID: "${HOST_GID:-1001}"
    ports:
      - "${U4I_VITE_PORT:-5173}:5173"
    # Host identity, like web: the dev server, `make vite-build` and built mode's `vite build` (compose.built.yaml
    # inherits this) write backend/static/dist into the checkout, which must stay owned by you, not root.
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    networks:
      default:
        aliases:
          - localhost
      # Compose also registers the bare name `vite` here, which resolves to every spoke's vite with N
      # spokes up: never use it in-network, only U4I_VITE_HOST (vite-<slug>, VITE_INTERNAL_HOST in web).
      u4i_shared:
        aliases:
          - ${U4I_VITE_HOST:?run the stack through make (it computes U4I_VITE_HOST)}
    environment:
      - NODE_ENV=development
      - ENABLE_SSL=false
      - DOCKER=true
      # vite.config.ts adds it to allowedHosts, so the hub browser can load assets via vite-<slug>.
      - U4I_VITE_HOST=${U4I_VITE_HOST:?run the stack through make (it computes U4I_VITE_HOST)}
    volumes:
      - ./frontend:/app/frontend
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./frontend/pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - /app/node_modules
      # Masks host frontend/node_modules (pnpm symlinks into the host store, unresolvable here)
      - /app/frontend/node_modules
      # The parent dir, not dist itself: docker would create a missing bind-mount source (dist) as root, which the
      # non-root vite could not write. Mounted this way, vite creates dist as the host user.
      - ./backend/static:/app/backend/static
    command: pnpm run dev
    healthcheck:
      test: |
        if [ "$${ENABLE_SSL:-false}" = "true" ]; then
          curl -f -k https://localhost:5173/@vite/client
        else
          curl -f http://localhost:5173/@vite/client
        fi
      interval: 10s
      timeout: 5s
      retries: 3

  workflow:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.Workflow
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-metrics:
        condition: service_healthy
    environment:
      - PRODUCTION=false
      - DEV_SERVER=false
      - METRICS_REDIS_URI=redis://redis-metrics:6379/0
      - METRICS_BUCKET_SECONDS=3600
      - METRICS_FLUSH_LIVENESS_THRESHOLD_SECONDS=180
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Local backup/cron scripts target the per-worktree dev DB (same expression as web).
      - POSTGRES_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
    volumes:
      - app_logs:/app/volume
      - workflow_logs:/app/workflow_logs
      - backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/metrics-venv/bin/python", "/app/check_flush_liveness.py"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 200s
    # u4i_shared so POSTGRES_HOST=db resolves to the hub db.
    networks:
      default: {}
      u4i_shared: {}

  # One-shot, idempotent provisioning of this spoke's dev DB on every `up` (docker/db-provision.sh, spoke
  # scope: create U4I_DEV_DB, revoke PUBLIC CONNECT) in the hub db. Cluster-wide objects (test role, base
  # test DB) belong to the hub's cluster-init. It waits for the hub db itself (no cross-project
  # depends_on), and reads POSTGRES_TEST_DB from .env for its collision guard. The `u4i_dev_urls4irl`
  # default matches the Makefile's derived U4I_DEV_DB on the primary clone.
  db-init:
    image: postgres:16.3-bookworm
    env_file:
      - .env
    restart: "no"
    volumes:
      - ./docker/db-provision.sh:/db-provision.sh:ro
    entrypoint: ["bash", "/db-provision.sh"]
    environment:
      - PGHOST=db
      - U4I_PROVISION_SCOPE=spoke
      - U4I_DEV_DB=${U4I_DEV_DB:-u4i_dev_urls4irl}
    # Talks only to the hub db, so it needs no default network.
    networks:
      - u4i_shared

  redis:
    image: redis:6.2.24
    # Session lease pool for 2 concurrent runs of 30 workers (DB 0 + base
    # session DB reserved); must equal scripts/capacity.py SHARED_REDIS_DATABASES.
    command: redis-server --databases 64
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-metrics:
    image: redis:6.2.24
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no --databases ${REDIS_METRICS_DATABASES:-16}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # On-demand public tunnel for remote testing (e.g. checking the mobile layout
  # from a phone). Dormant unless explicitly started via the "tunnel" profile
  # (`make tunnel`). Cloudflare quick tunnels need no account or token and print
  # an ephemeral https://<random>.trycloudflare.com URL to their logs.
  #
  # SECURITY: that trycloudflare.com URL grants UNAUTHENTICATED public access to
  # the entire local app (no login wall in front of the tunnel). Treat it as a
  # temporary, private link — never share it publicly and never leave the tunnel
  # running; tear it down (`make tunnel` stop / stop this service) when finished.
  #
  # `--url http://web:5000` points at Flask's INTERNAL container port (the `web`
  # service listens on 5000 inside the compose network), not a host-published port.
  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:5000
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

networks:
  default: {}
  # The per-user network the hub lives on. Only web, vite, workflow and db-init join it (web/vite under
  # slugged aliases); redis, redis-metrics and cloudflared stay off it, since compose registers each
  # service name as an alias there and N spokes' bare names would be ambiguous.
  u4i_shared:
    external: true
    name: ${U4I_SHARED_NET:?run the stack through make (it computes U4I_SHARED_NET)}

volumes:
  redisdata:
  app_logs:
  workflow_logs:
  backups:



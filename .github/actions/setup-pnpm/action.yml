name: Setup pnpm
description: Install the pinned node + pnpm toolchain (.mise.toml) and restore the pnpm store cache. Requires the repo to be checked out first.

runs:
  using: composite
  steps:
    - name: Install pinned toolchain (.mise.toml)
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: "2026.6.14"
        install_args: "node pnpm"

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      working-directory: frontend
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

name: Setup Playwright
description: Install Playwright's chromium + its apt deps, restoring and saving them via a shared cache. Requires the repo to be checked out and the playwright Python package installed first.

outputs:
  cache-hit:
    description: "'true' when the exact Playwright cache key was restored"
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: playwright-version
      shell: bash
      run: |
        version="$(sed -nE 's/^playwright==([^[:space:]#]+).*/\1/p' requirements/requirements-test.txt)"
        if [[ -z "$version" ]]; then
          echo "::error::no playwright== pin found in requirements/requirements-test.txt"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Caches apt's .deb archives (Playwright's --with-deps system packages) together with the
    # browser in ~/.cache/ms-playwright. A cold apt download once took 7m24s at ~72 kB/s.
    # The schema tag (v1) precedes the version so a hand bump to v2 also escapes restore-keys.
    # Every matrix row shares one key: on a miss, concurrent saves race, and the losers log
    # a harmless "unable to reserve cache" warning.
    # The path list below is part of the cache version hash, so it must stay byte-identical to
    # the save step's: a mismatch is a silent miss.
    - name: Restore Playwright apt packages and browser
      id: playwright-cache
      uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      with:
        path: |
          ~/.cache/apt-archives
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-v1-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-playwright-v1-

    # --with-deps runs apt-get, which then reuses the cached debs and only downloads changed ones.
    - name: Point apt at the cached archive dir
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/apt-archives/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99-u4i-archive-cache > /dev/null

    - name: Install Playwright browser
      shell: bash
      run: python3.11 -m playwright install chromium --with-deps

    # apt writes the archives (and its lock/partial files) as root; hand them to the runner
    # user so the save step can tar them, dropping the lock and any half-downloaded partials.
    - name: Prepare apt archive dir for caching
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo rm -f "$HOME/.cache/apt-archives/lock"
        sudo find "$HOME/.cache/apt-archives/partial" -mindepth 1 -delete
        sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives"

    # Saved right after the install (not in a combined action's post-step), so a job that
    # later fails or times out in pytest still persists the cache.
    - name: Save Playwright apt packages and browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      with:
        path: |
          ~/.cache/apt-archives
          ~/.cache/ms-playwright
        key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

name: Check Generated Types Freshness
permissions:
  contents: read

on:
  workflow_call:

jobs:
  types-staleness:
    name: Generated Types Staleness Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FLASK_APP: 'backend:create_app'
      FLASK_DEBUG: 'false'
      PRODUCTION: 'false'
      SECRET_KEY: 'ABCDEFGH12345678'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'postgres'
      MAILJET_API_KEY: 'dummy-not-used'
      MAILJET_SECRET_KEY: 'dummy-not-used'
      BASE_EMAIL: 'noreply@example.com'
      # `mise exec` would otherwise install every missing .mise.toml tool (python, ruff, ...) on
      # first use, ignoring install_args below. Off, a tool this job doesn't need is only warned about.
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.14'
          cache: 'pip'
          cache-dependency-path: '**/requirements/requirements-test.txt'

      - name: Install Python dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          pip install -r requirements/requirements-test.txt

      - name: Generate OpenAPI spec
        run: flask openapi generate --output frontend/types/openapi.json --strict

      - name: Install pinned toolchain (.mise.toml)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: "node pnpm"

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript types
        working-directory: frontend
        run: pnpm exec openapi-typescript types/openapi.json -o types/api.d.ts

      - name: Format generated types with prettier
        working-directory: frontend
        run: pnpm exec prettier --write types/api.d.ts types/openapi.json

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code frontend/types/; then
            echo "::error::Generated types are stale. Run 'make generate-types' and commit the updated files."
            exit 1
          fi

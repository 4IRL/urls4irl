name: Check Generated Types Freshness
permissions:
  contents: read

on:
  workflow_call:

jobs:
  types-staleness:
    name: Generated Types Staleness Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FLASK_APP: 'backend:create_app'
      FLASK_DEBUG: 'false'
      PRODUCTION: 'false'
      SECRET_KEY: 'ABCDEFGH12345678ABCDEFGH12345678'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'postgres'
      MAILJET_API_KEY: 'dummy-not-used'
      MAILJET_SECRET_KEY: 'dummy-not-used'
      BASE_EMAIL: 'noreply@example.com'
      # `mise exec` would otherwise install every missing .mise.toml tool (python, ruff, ...) on
      # first use, ignoring the setup-pnpm action's install_args. Off, a tool this job doesn't need is only warned about.
      MISE_EXEC_AUTO_INSTALL: "false"
      METRICS_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements/requirements-test.txt'

      - name: Install Python dependencies
        run: |
          python3.14 -m pip install --upgrade pip==26.2.1
          pip install -r requirements/requirements-test.txt

      - name: Generate OpenAPI spec
        run: flask openapi generate --output frontend/types/openapi.json --strict

      - name: Generate error-code constants
        run: flask openapi generate-error-codes --output frontend/types/error-codes.ts

      - name: Generate metrics dimension types
        run: flask metrics generate-dim-types --output frontend/types/metrics-dimensions.d.ts

      - name: Generate metrics dimension values
        run: flask metrics generate-dim-values --output frontend/types/metrics-dim-values.ts

      - name: Generate metrics events
        run: flask metrics generate-events --output frontend/types/metrics-events.ts

      - name: Generate metrics resources
        run: flask metrics generate-resources --output frontend/types/metrics-resources.ts

      - name: Install pinned toolchain (.mise.toml) + cache pnpm store
        uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript types
        working-directory: frontend
        run: pnpm exec openapi-typescript types/openapi.json -o types/api.d.ts

      - name: Format generated types with prettier
        working-directory: frontend
        run: pnpm exec prettier --write types/api.d.ts types/openapi.json types/error-codes.ts types/metrics-dimensions.d.ts types/metrics-dim-values.ts types/metrics-events.ts types/metrics-resources.ts

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code --stat frontend/types/; then
            git diff frontend/types/ | head -n 200
            echo "::error::Generated types are stale. Run 'make generate-types' and commit the updated files."
            exit 1
          fi

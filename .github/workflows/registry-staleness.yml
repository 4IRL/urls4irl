name: Check Endpoint Registry
permissions:
  contents: read

on:
  workflow_call:

jobs:
  registry-staleness:
    name: Endpoint Registry Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FLASK_APP: 'backend:create_app'
      FLASK_DEBUG: 'false'
      PRODUCTION: 'false'
      SECRET_KEY: 'ABCDEFGH12345678'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'postgres'
      MAILJET_API_KEY: 'dummy-not-used'
      MAILJET_SECRET_KEY: 'dummy-not-used'
      BASE_EMAIL: 'noreply@example.com'
      METRICS_ENABLED: 'false'
      # Kept identical to event-coverage-staleness.yml: stops any `mise exec` from installing every
      # missing .mise.toml tool on first use. This Python-only job runs no mise, so it is inert here.
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.14'
          cache: 'pip'
          cache-dependency-path: '**/requirements/requirements-test.txt'

      - name: Install Python dependencies
        run: |
          python3.11 -m pip install --upgrade pip==26.2.1
          pip install -r requirements/requirements-test.txt

      - name: Run endpoint registry audit
        run: |
          if ! flask endpoints audit --strict; then
            echo "::error::Endpoint registry audit failed. Run 'make generate-endpoints' (or fix all_routes.py JS linkage) and commit docs/endpoints/."
            exit 1
          fi

name: Check Formatting
permissions:
  contents: read

on: 
  workflow_call:

jobs:
  Format:
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest

    env:
      # `mise exec` would otherwise install every missing .mise.toml tool (shellcheck, actionlint, ...) on
      # first use, ignoring install_args below. Off, a tool this job doesn't need is only warned about.
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned toolchain (.mise.toml)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: "node pnpm python ruff shfmt"

      - name: Check .mise.toml is pin-only
        run: make mise-config-check

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting (ruff, prettier, shfmt)
        run: make format-check

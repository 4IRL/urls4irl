name: Tests
permissions:
  contents: read

on: 
  workflow_call:
    secrets:
      MAILJET_API_KEY:
        required: true
      MAILJET_SECRET_KEY:
        required: true
      BASE_EMAIL:
        required: true

env:
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_DB: 'postgres'
  POSTGRES_TEST_DB: 'postgres'
  REDIS_URI: 'redis://localhost:6379/0'
  TEST_REDIS_URI: 'redis://localhost:6379/1'
  TEST_METRICS_REDIS_URI: 'redis://localhost:6380/0'

jobs:
  JS-Unit-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: JS Unit Tests

    env:
      # `mise exec` would otherwise install every missing .mise.toml tool (python, ruff, ...) on
      # first use, ignoring the setup-pnpm action's install_args. Off, a tool this job doesn't need is only warned about.
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned toolchain (.mise.toml) + cache pnpm store
        uses: ./.github/actions/setup-pnpm

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run JS unit tests
        working-directory: frontend
        run: pnpm exec vitest run --coverage

  Tests-Integration:
    env:
      FLASK_DEBUG: 'false'
      PRODUCTION: 'false'
      SECRET_KEY: 'ABCDEFGH12345678'
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
      BASE_EMAIL: ${{ secrets.BASE_EMAIL }}

    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Splits tests into multiple workers
    strategy:
      matrix:
        worker:
          - ['Unit Tests', 'unit', 3]
          - ['Splash Integration Tests', 'splash', 3]
          - ['UTub Integration Tests', 'utubs', 3]
          - ['UTub Member Integration Tests', 'members', 3]
          - ['UTub URL Integration Tests', 'urls', 3]
          - ['UTub Tags Integration Tests', 'tags', 3]
          - ['Account and Support Integration Tests', 'account_and_support', 3]
          - ['CLI Integration Tests', 'cli', 3]
          - ['Mobile API Integration Tests', 'mobile_api', 3]
          - ['Admin Integration Tests', 'admin', 3]

    name: ${{ format('{0}', matrix.worker[0]) }}

    # Service containers to run with `Run-Tests`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: 'postgres:16.3-bookworm'
        # Map the ports
        ports:
          - 5432:5432
        # Provide the password for postgres
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service configuration
      redis:
        image: 'redis:6.2.16-alpine'
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Dedicated metrics Redis container (isolated from shared sessions/limiter).
      redis-metrics:
        image: 'redis:6.2.16-alpine'
        ports:
          - 6380:6379
        command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no
        options: >-
          --health-cmd "redis-cli ping | grep PONG || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # 👇 We need to set up the env vars from values taken from the matrix
      - name: Set up worker env vars
        run: |
          echo "GITHUB_TEST_MARKER=${{ matrix.worker[1] }}" >> "$GITHUB_ENV"

      - name: Set xdist workers
        run: echo "XDIST_N=${{ matrix.worker[2] }}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.14'
          cache: 'pip'
          cache-dependency-path: '**/requirements/requirements-test.txt'

      - name: Setup caching
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        id: cache
        with:
          path: ${{ env.pythonLocation }}/lib/python3.11/site-packages/*
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python3.11 -m pip install --upgrade pip;
          pip install -r requirements/requirements-test.txt;

      - name: Run tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
        timeout-minutes: 15
        run: |
          if [[ "$XDIST_N" -gt 0 ]]; then
            python3.11 -m pytest -n "$XDIST_N" --dist=loadscope
          else
            python3.11 -m pytest
          fi

  Tests-UI:
    env:
      FLASK_DEBUG: 'false'
      PRODUCTION: 'false'
      SECRET_KEY: 'ABCDEFGH12345678'
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
      BASE_EMAIL: ${{ secrets.BASE_EMAIL }}
      # `mise exec` would otherwise install every missing .mise.toml tool (python, ruff, ...) on
      # first use, ignoring the setup-pnpm action's install_args. Off, a tool this job doesn't need is only warned about.
      MISE_EXEC_AUTO_INSTALL: "false"

    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Splits tests into multiple workers
    strategy:
      matrix:
        worker:
          - ['UI Splash Functional Tests', 'splash_ui', 2]
          - ['UI Home Functional Tests', 'home_ui', 2]
          - ['UI UTub Functional Tests', 'utubs_ui', 2]
          - ['UI Member Functional Tests', 'members_ui', 2]
          - ['UI URL Functional Tests', 'urls_ui', 2]
          - ['UI Create URL Functional Tests', 'create_urls_ui', 2]
          - ['UI Update URL Functional Tests', 'update_urls_ui', 2]
          - ['UI Tags Functional Tests', 'tags_ui', 2]
          - ['UI Mobile Functional Tests', 'mobile_ui', 2]
          - ['UI Metrics Dashboard Functional Tests', 'metrics_ui', 2]
          - ['UI Settings Functional Tests', 'settings_ui', 2]
          - ['UI Cross-UTub Search Functional Tests', 'search_ui', 2]
          - ['UI Admin Functional Tests', 'admin_ui', 2]

    name: ${{ format('{0}', matrix.worker[0]) }}

    # Service containers to run with `Run-Tests`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: 'postgres:16.3-bookworm'
        # Map the ports
        ports:
          - 5432:5432
        # Provide the password for postgres
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service configuration
      redis:
        image: 'redis:6.2.16-alpine'
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Dedicated metrics Redis container (isolated from shared sessions/limiter).
      redis-metrics:
        image: 'redis:6.2.16-alpine'
        ports:
          - 6380:6379
        command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no
        options: >-
          --health-cmd "redis-cli ping | grep PONG || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # 👇 We need to set up the env vars from values taken from the matrix
      - name: Set up worker env vars
        run: |
          echo "GITHUB_TEST_MARKER=${{ matrix.worker[1] }}" >> "$GITHUB_ENV"

      - name: Set xdist workers
        run: echo "XDIST_N=${{ matrix.worker[2] }}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.14'
          cache: 'pip'
          cache-dependency-path: '**/requirements/requirements-test.txt'

      - name: Setup caching
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        id: cache
        with:
          path: ${{ env.pythonLocation }}/lib/python3.11/site-packages/*
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python3.11 -m pip install --upgrade pip;
          pip install -r requirements/requirements-test.txt;

      # Every worker in this job is a UI worker, so the chromium binary is
      # provisioned unconditionally (previously bounded to a numeric worker
      # range within a shared job).
      - name: Install Playwright browser
        run: python3.11 -m playwright install chromium --with-deps

      - name: Install pinned toolchain (.mise.toml) + cache pnpm store
        uses: ./.github/actions/setup-pnpm

      # vite.config.ts resolves entries from a root-level __dirname, so the manifests are copied to
      # the repo root. pnpm-workspace.yaml must travel with the lockfile (overrides, release-age
      # excludes, allowBuilds); its `packages: ["."]` keeps frontend/package.json out of the workspace.
      - name: Install frontend dependencies and build
        run: |
          bash frontend/setup-vendor.sh
          cp frontend/package.json frontend/pnpm-lock.yaml frontend/pnpm-workspace.yaml frontend/vite.config.ts ./
          pnpm install --frozen-lockfile
          pnpm exec vite build
          rm package.json pnpm-lock.yaml pnpm-workspace.yaml vite.config.ts

      - name: Run tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
        timeout-minutes: 15
        run: |
          if [[ "$XDIST_N" -gt 0 ]]; then
            python3.11 -m pytest -n "$XDIST_N" --dist=loadscope
          else
            python3.11 -m pytest
          fi

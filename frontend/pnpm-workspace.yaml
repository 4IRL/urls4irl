# pnpm settings for the single-package frontend (no `packages:` key).
# pnpm 11 reads these only from this file; the package.json "pnpm" field and
# npm's top-level "overrides" are ignored.

overrides:
  # esbuild 0.28.2 deliberately exceeds vite 7.3.5's `^0.27.0` range to fix
  # Dependabot alert #751 (commit b6e29d99).
  esbuild: 0.28.2
  picomatch: 4.0.4
  postcss: 8.5.23

# openapi-typescript@7.13.0 declares a `typescript ^5.x` peer, but the project
# uses typescript 6.0.2. Scoped to this one known conflict (replaces npm's
# blanket legacy-peer-deps=true).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6.0.2"

# Supply-chain hygiene: refuse any package version published less than
# 90 days ago.
minimumReleaseAge: 129600 # 90 days, ported from npm min-release-age=90

# Quarantine exemptions: security pins (overrides above), their transitive
# deps, and transitive versions bumped by the Dependabot security pass (commit
# b6e29d99), all under 90 days old at the npm -> pnpm migration. Without an
# entry, installs fail (pinned overrides, --frozen-lockfile) or re-resolve to
# an older mature version (ranged transitives). Exact versions only, never a
# wildcard like "@esbuild/*". Prune after ~2026-11-08. A future in-window
# security bump needs its own exact entry (replaces `npm i --min-release-age 0`).
minimumReleaseAgeExclude:
  - esbuild@0.28.2
  - "@esbuild/aix-ppc64@0.28.2"
  - "@esbuild/android-arm@0.28.2"
  - "@esbuild/android-arm64@0.28.2"
  - "@esbuild/android-x64@0.28.2"
  - "@esbuild/darwin-arm64@0.28.2"
  - "@esbuild/darwin-x64@0.28.2"
  - "@esbuild/freebsd-arm64@0.28.2"
  - "@esbuild/freebsd-x64@0.28.2"
  - "@esbuild/linux-arm@0.28.2"
  - "@esbuild/linux-arm64@0.28.2"
  - "@esbuild/linux-ia32@0.28.2"
  - "@esbuild/linux-loong64@0.28.2"
  - "@esbuild/linux-mips64el@0.28.2"
  - "@esbuild/linux-ppc64@0.28.2"
  - "@esbuild/linux-riscv64@0.28.2"
  - "@esbuild/linux-s390x@0.28.2"
  - "@esbuild/linux-x64@0.28.2"
  - "@esbuild/netbsd-arm64@0.28.2"
  - "@esbuild/netbsd-x64@0.28.2"
  - "@esbuild/openbsd-arm64@0.28.2"
  - "@esbuild/openbsd-x64@0.28.2"
  - "@esbuild/openharmony-arm64@0.28.2"
  - "@esbuild/sunos-x64@0.28.2"
  - "@esbuild/win32-arm64@0.28.2"
  - "@esbuild/win32-ia32@0.28.2"
  - "@esbuild/win32-x64@0.28.2"
  - postcss@8.5.23
  - nanoid@3.3.18
  - "@redocly/openapi-core@1.34.19"
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - js-yaml@4.3.1
  - ws@8.21.3

# pnpm 11 defaults this to `install`: `pnpm run`/`pnpm exec` would silently
# run a full install (registry fetch, build scripts, lockfile rewrite) when
# node_modules is stale. `error` makes them fail closed instead; resync with
# `make tools` on the host or `make build` for the containers.
verifyDepsBeforeRun: error

# Build-script allowlist. pnpm 11 fails the install on any unlisted build
# script (strictDepBuilds). fsevents is a macOS-only optional dep via rollup.
allowBuilds:
  esbuild: true
  fsevents: false

# Every hook calls the same `make` check target that developers and CI run (host tools pinned in
# .mise.toml; install once per machine with `make tools`). Hooks never call `make format`, so a
# commit never rewrites files — run `make format` yourself to fix a failure. The targets check the
# whole tree, so an untracked, non-ignored .py/.ts file with errors can also block a commit.
repos:
  - repo: local
    hooks:
    - id: ruff-lint
      name: ruff-lint
      entry: make lint-python
      language: system
      types_or: [python]
      pass_filenames: false
      require_serial: true

    - id: ruff-format
      name: ruff-format
      entry: make format-check-python
      language: system
      types_or: [python]
      pass_filenames: false
      require_serial: true

    - id: eslint
      name: eslint
      entry: make lint-frontend
      language: system
      types_or: [javascript, ts]
      pass_filenames: false
      require_serial: true

    - id: prettier
      name: prettier
      entry: make format-check-frontend
      language: system
      types_or: [javascript, ts]
      pass_filenames: false
      require_serial: true

    - id: typecheck
      name: typecheck
      entry: make typecheck
      language: system
      types: [ts]
      pass_filenames: false
      require_serial: true

    - id: shell-lint
      name: shell-lint
      entry: make lint-shell
      language: system
      types: [shell]
      files: \.sh$
      exclude: ^\.claude/(hooks|worktrees)/
      pass_filenames: false
      require_serial: true

    - id: shell-format
      name: shell-format
      entry: make format-check-shell
      language: system
      types: [shell]
      files: \.sh$
      exclude: ^\.claude/(hooks|worktrees)/
      pass_filenames: false
      require_serial: true

    - id: lint-actions
      name: lint-actions
      entry: make lint-actions
      language: system
      types: [yaml]
      files: ^\.github/workflows/
      pass_filenames: false
      require_serial: true

    # Workspace-wide presence check (no types/files filter): runs on every commit.
    - id: lockfile-check
      name: lockfile-check
      entry: make lockfile-check
      language: system
      pass_filenames: false
      require_serial: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
    - id: ruff-format

  - repo: https://github.com/pycqa/flake8
    rev: "7.1.2"
    hooks:
    - id: flake8
      args: [--extend-ignore, "E501,E203"]
      
  - repo: local
    hooks:
    - id: prettier
      name: prettier
      entry: prettier --write --ignore-unknown
      language: node
      additional_dependencies: ["prettier@3.8.4"]
      types_or: [javascript, ts]
      exclude: ^(backend/static/dist/|backend/static/vendor/|frontend/public/vendor/)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: "v9.21.0"
    hooks:
    - id: eslint
      name: eslint (js)
      args: [--no-config-lookup]
      types: [javascript]
    - id: eslint
      name: eslint (ts)
      args: [--config, frontend/eslint.config.js]
      types: [ts]
      additional_dependencies:
        - eslint@9.39.4
        - "@typescript-eslint/parser@8.58.1"
        - "@typescript-eslint/eslint-plugin@8.58.1"

  - repo: local
    hooks:
    - id: tsc-typecheck
      name: TypeScript typecheck
      entry: docker compose --project-directory . -f docker/compose.local.yaml exec -T vite npx tsc --noEmit --project frontend/tsconfig.json
      language: system
      types: [ts]
      pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1"
    hooks:
    - id: shellcheck
      args: [--severity=warning, -x]
      exclude: ^\.claude/(hooks|worktrees)/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: "v3.13.1-1"
    hooks:
    - id: shfmt
      args: [-i, "2", -ci, --write]
      exclude: ^\.claude/(hooks|worktrees)/
